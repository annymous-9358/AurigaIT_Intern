<svg width="100%" height="100%" viewBox="0 0 1600 270" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6161;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d63031;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1600" height="270" fill="url(#bgGradient2)"/>
  
  <!-- Decorative shapes -->
  <circle cx="1350" cy="70" r="70" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1450" cy="180" r="50" fill="rgba(255,255,255,0.08)"/>
  
  <!-- Main heading -->
  <text x="80" y="90" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white">
    FASHION WEEK
  </text>
  
  <!-- Subheading -->
  <text x="80" y="130" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.9)">
    Trendy Styles at Unbeatable Prices
  </text>
  
  <!-- Offer badge -->
  <ellipse cx="80" cy="190" rx="50" ry="25" fill="#ffd700"/>
  <text x="80" y="198" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">
    70% OFF
  </text>
  
  <!-- Call to action -->
  <rect x="160" y="170" width="160" height="40" rx="20" fill="white"/>
  <text x="240" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d63031" text-anchor="middle">
    EXPLORE
  </text>
  
  <!-- Fashion icons -->
  <circle cx="1200" cy="100" r="3" fill="rgba(255,255,255,0.6)"/>
  <circle cx="1220" cy="120" r="4" fill="rgba(255,255,255,0.5)"/>
  <circle cx="1180" cy="130" r="2" fill="rgba(255,255,255,0.7)"/>
</svg>
